name: docker-image-unit-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; never kill in-flight pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-image:
    name: "Test: ${{ matrix.image.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        image:
          - name: service-a
            context: .
            dockerfile: ./Dockerfile
            test_command: npm test -- --run
          - name: service-b
            context: ./api
            dockerfile: ./api/Dockerfile
            test_command: pytest -q

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          tags: ${{ matrix.image.name }}:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Run unit tests inside container
        env:
          TEST_CMD: ${{ matrix.image.test_command }}
          IMAGE: ${{ matrix.image.name }}:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          chmod 777 artifacts   # allow non-root container users to write here
          # --entrypoint makes the command run identically regardless of the
          # image's ENTRYPOINT; plain `sh -c` avoids login-shell PATH resets.
          docker run --rm \
            --init \
            --entrypoint /bin/sh \
            -v "$PWD/artifacts:/artifacts" \
            -e TEST_CMD \
            "$IMAGE" \
            -c 'eval "$TEST_CMD"' 2>&1 | tee test-output.log

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.image.name }}-${{ github.run_attempt }}
          path: |
            test-output.log
            artifacts/
          if-no-files-found: ignore

  summary:
    needs: test-image
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Final verdict
        env:
          RESULT: ${{ needs.test-image.result }}
        run: |
          echo "test-image result: $RESULT"
          case "$RESULT" in
            success)
              echo "All images passed their unit tests." ;;
            *)
              echo "::error::One or more images failed their unit tests (result: $RESULT)"
              exit 1 ;;
          esac
