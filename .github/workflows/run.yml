name: chat-stress-test

on:
  workflow_dispatch:
    inputs:
      total_turns:
        description: Number of exchanges
        default: "300"
      turn_delay_ms:
        description: Pause between messages (ms)
        default: "2500"
      new_chat_every:
        description: Fresh chat every K turns (0 = one long conversation)
        default: "0"
      target_url:
        description: Chat URL
        default: "https://chat.z.ai/"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # GitHub-hosted job hard cap is 360

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Write stress-test script
        run: |
          cat > chat-stress.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          
          /* ================================ config =============================== */
          
          const int = (v, d) => (Number.isFinite(parseInt(v, 10)) ? parseInt(v, 10) : d);
          
          const CFG = {
            url: process.env.TARGET_URL || 'https://chat.z.ai/',
            totalTurns: int(process.env.TOTAL_TURNS, 300),
            turnDelayMs: int(process.env.TURN_DELAY_MS, 2500),
            replyTimeoutMs: int(process.env.REPLY_TIMEOUT_MS, 180000),
            newChatEvery: int(process.env.NEW_CHAT_EVERY, 0),
            headless: (process.env.HEADLESS ?? 'true') !== 'false',
            verbose: (process.env.VERBOSE ?? 'true') !== 'false',
            logDir: process.env.LOG_DIR || 'logs',
            stableMs: int(process.env.STABLE_MS, 4000),
            maxDebugCaptures: int(process.env.MAX_DEBUG_CAPTURES, 10000),
            pollMs: 500,
            abortAfterConsecutiveFailures: 5,
          };
          
          const SELECTORS = {
            input: [
              'textarea[placeholder]',
              'div[contenteditable="true"]',
              'textarea',
              '[role="textbox"]',
            ],
            sendButton: [
              'button[aria-label*="send" i]',
              'button[data-testid*="send" i]',
              '#send-message-button',
              'button[type="submit"]',
            ],
            stopButton: [
              'button[aria-label*="stop" i]',
              'button[data-testid*="stop" i]',
            ],
            assistantMessage: [
              '[data-message-author-role="assistant"]',
              '[class*="assistant" i][class*="message" i]',
              '[class*="assistant" i][class*="bubble" i]',
            ],
            newChat: [
              'a[aria-label*="new chat" i]',
              'button[aria-label*="new chat" i]',
              'a[href$="/new"]',
            ],
          };
          
          /* ================================ logging ============================== */
          
          const LOG_DIR = CFG.logDir;
          const JSONL_FILE = path.join(LOG_DIR, 'chat-log.jsonl');
          const TRANSCRIPT = path.join(LOG_DIR, 'transcript.md');
          const SUMMARY_FILE = path.join(LOG_DIR, 'summary.json');
          const DEBUG_LOG = path.join(LOG_DIR, 'debug.log');
          const SHOT_DIR = path.join(LOG_DIR, 'screenshots');
          const DUMP_DIR = path.join(LOG_DIR, 'dumps');
          fs.mkdirSync(SHOT_DIR, { recursive: true });
          fs.mkdirSync(DUMP_DIR, { recursive: true });
          
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          
          // Every line goes to the Actions log AND logs/debug.log
          function emit(line) {
            console.log(line);
            try { fs.appendFileSync(DEBUG_LOG, line + '\n'); } catch {}
          }
          function vlog(...args) {
            const msg = args.map((a) => (typeof a === 'string' ? a : JSON.stringify(a))).join(' ');
            emit(`[${new Date().toISOString().slice(11, 23)}] ${msg}`);
          }
          const dlog = (...a) => { if (CFG.verbose) vlog(...a); };   // very noisy detail
          function block(title, text) {
            const t = String(text ?? '');
            emit(`  +---- ${title} (${t.length} chars) ----`);
            for (const l of t.split('\n')) emit(`  | ${l}`);
            emit('  +----');
          }
          
          const appendJsonl = (e) => fs.appendFileSync(JSONL_FILE, JSON.stringify(e) + '\n');
          
          function appendTranscript(e) {
            const status = e.ok
              ? `OK ${(e.durationMs / 1000).toFixed(1)}s, attempts=${e.attempt}, ${e.ackValid ? 'ACK valid' : 'ACK MISSING'}`
              : `FAILED: ${e.error || 'unknown error'}`;
            const md = [`## Turn ${e.turn} | ${e.timestamp} | ${status}`, '', '**User:**', '', '```', e.prompt, '```', ''];
            if (e.response) md.push('**Assistant:**', '', '```', e.response, '```', '');
            if (e.attemptLog && e.attemptLog.length) {
              md.push('**Failed attempts:**', '');
              for (const a of e.attemptLog) md.push(`- attempt ${a.attempt} failed at stage \`${a.stage}\` after ${a.durationMs}ms: ${a.error}`);
              md.push('');
            }
            fs.appendFileSync(TRANSCRIPT, md.join('\n') + '\n');
          }
          
          function loadProgress() {
            if (!fs.existsSync(JSONL_FILE)) return 0;
            let last = 0;
            for (const line of fs.readFileSync(JSONL_FILE, 'utf8').split('\n')) {
              if (!line.trim()) continue;
              try {
                const e = JSON.parse(line);
                if (e.ok && typeof e.turn === 'number' && e.turn > last) last = e.turn;
              } catch {}
            }
            return last;
          }
          
          const writeSummary = (extra) =>
            fs.writeFileSync(SUMMARY_FILE, JSON.stringify({ ...extra, config: CFG }, null, 2));
          
          process.on('unhandledRejection', (r) => { vlog('UNHANDLED REJECTION:', String((r && r.stack) || r)); process.exitCode = 1; });
          
          /* =============================== page helpers ========================== */
          
          // Polls every selector until one is visible (or timeout). Logs which one matched.
          async function findFirst(page, selectors, { timeout = 3000, label = 'element' } = {}) {
            const t0 = Date.now();
            do {
              for (const sel of selectors) {
                const loc = page.locator(sel).first();
                if (await loc.isVisible().catch(() => false)) {
                  dlog(`  findFirst[${label}] MATCH "${sel}" after ${Date.now() - t0}ms`);
                  return loc;
                }
              }
              await sleep(200);
            } while (Date.now() - t0 < timeout);
            vlog(`  findFirst[${label}] NO MATCH after ${timeout}ms. Tried: ${selectors.join(' | ')}`);
            return null;
          }
          
          async function anyVisible(page, selectors) {
            for (const sel of selectors) {
              if (await page.locator(sel).first().isVisible().catch(() => false)) return true;
            }
            return false;
          }
          
          async function latestAssistant(page) {
            for (const sel of SELECTORS.assistantMessage) {
              const loc = page.locator(sel);
              const count = await loc.count().catch(() => 0);
              if (!count) continue;
              const txt = await loc.last().innerText({ timeout: 400 }).catch(() => '');
              if (txt && txt.trim()) return { text: txt.trim(), sel, count };
            }
            return { text: null, sel: null, count: 0 };
          }
          
          const bodyText = (page) => page.evaluate(() => document.body.innerText);
          
          function diffTail(before, after) {
            if (!after) return '';
            if (before && after.startsWith(before)) return after.slice(before.length);
            return after.length > 2000 ? after.slice(-2000) : after;
          }
          
          function stripPrompt(text, prompt) {
            if (!text) return '';
            const i = prompt ? text.lastIndexOf(prompt) : -1;
            return i === -1 ? text : text.slice(i + prompt.length);
          }
          
          /** Dumps what the page looks like right now: which selectors match + all inputs/buttons. */
          async function probe(page, label) {
            emit('');
            vlog(`--- PROBE "${label}" url=${page.url()} title="${await page.title().catch(() => '?')}"`);
            for (const [group, sels] of Object.entries(SELECTORS)) {
              for (const sel of sels) {
                const loc = page.locator(sel);
                const count = await loc.count().catch(() => -1);
                let vis = false, en = null;
                if (count > 0) {
                  vis = await loc.first().isVisible().catch(() => false);
                  en = await loc.first().isEnabled().catch(() => null);
                }
                emit(`    ${group.padEnd(16)} ${sel.padEnd(50)} count=${count} firstVisible=${vis} enabled=${en}`);
              }
            }
            const info = await page.evaluate(() => {
              const desc = (el) =>
                `<${el.tagName.toLowerCase()} id="${el.id}" class="${((el.className && el.className.toString()) || '').slice(0, 70)}"` +
                ` aria-label="${el.getAttribute('aria-label') || ''}" data-testid="${el.getAttribute('data-testid') || ''}"` +
                ` placeholder="${el.getAttribute('placeholder') || ''}" type="${el.getAttribute('type') || ''}" disabled=${!!el.disabled}>`;
              return {
                inputs: [...document.querySelectorAll('textarea,[contenteditable="true"],[role="textbox"],input')].slice(0, 10).map(desc),
                buttons: [...document.querySelectorAll('button')].slice(0, 40)
                  .map((b) => desc(b) + ' text="' + (b.innerText || '').trim().slice(0, 30) + '"'),
                bodyLen: document.body.innerText.length,
                bodyTail: document.body.innerText.slice(-700),
              };
            }).catch((e) => ({ error: String(e) }));
            if (info.error) { vlog('  probe evaluate failed:', info.error); return; }
            emit(`    input-like elements on page (${info.inputs.length}):`);
            info.inputs.forEach((s) => emit(`      ${s}`));
            emit(`    buttons on page (${info.buttons.length}, first 40):`);
            info.buttons.forEach((s) => emit(`      ${s}`));
            block(`page body tail (bodyLen=${info.bodyLen})`, info.bodyTail);
            emit('');
          }
          
          let captureSequence = 0;
          async function screenshot(page, name) {
            const id = String(++captureSequence).padStart(6, '0');
            const safeName = name.replace(/[^a-zA-Z0-9_-]/g, '-').slice(0, 120);
            const relativePath = `screenshots/${id}-${safeName}.png`;
            const event = { timestamp: new Date().toISOString(), name, screenshot: relativePath, url: page.url() };
            try {
              await page.screenshot({ path: path.join(LOG_DIR, relativePath), timeout: 10000 });
              event.ok = true;
              vlog(`SCREENSHOT saved: ${relativePath}`);
            } catch (err) {
              event.ok = false;
              event.error = String(err.stack || err);
              vlog(`SCREENSHOT FAILED: ${name}: ${event.error}`);
            }
            fs.appendFileSync(path.join(LOG_DIR, 'events.jsonl'), JSON.stringify(event) + '\n');
          }
          
          async function action(page, label, fn) {
            await screenshot(page, `${label}-before`);
            const start = Date.now();
            vlog(`ACTION START: ${label}`);
            try {
              const result = await fn();
              vlog(`ACTION OK: ${label} (${Date.now() - start}ms)`);
              await screenshot(page, `${label}-after`);
              return result;
            } catch (err) {
              vlog(`ACTION FAILED: ${label} (${Date.now() - start}ms): ${err.stack || err}`);
              await screenshot(page, `${label}-FAILED`);
              throw err;
            }
          }
          
          let debugCaptures = 0;
          async function captureDebug(page, name) {
            if (debugCaptures >= CFG.maxDebugCaptures) {
              vlog(`(debug capture "${name}" skipped, cap of ${CFG.maxDebugCaptures} reached)`);
              return;
            }
            debugCaptures++;
            await screenshot(page, name);
            try {
              fs.writeFileSync(path.join(DUMP_DIR, `${name}.body.txt`), await bodyText(page));
              fs.writeFileSync(path.join(DUMP_DIR, `${name}.html`), await page.content());
              vlog(`  saved debug capture "${name}" (screenshot + body text + html)`);
            } catch (e) {
              vlog(`  debug capture "${name}" failed: ${e.message}`);
            }
            await probe(page, name);
          }
          
          async function waitUntilReady(page) {
            vlog(`Navigating to ${CFG.url}`);
            const resp = await action(page, 'navigate', () => page.goto(CFG.url, { waitUntil: 'domcontentloaded', timeout: 60000 }));
            vlog(`Navigation done: status=${resp ? resp.status() : 'n/a'} url=${page.url()}`);
          
            for (let i = 0; i < 6; i++) {
              const title = await page.title().catch(() => '');
              vlog(`  title check ${i + 1}/6: "${title}"`);
              if (/just a moment|attention required|verify you are human/i.test(title)) {
                vlog('  bot-protection challenge detected, waiting 10s');
                await sleep(10000);
                await page.waitForLoadState('domcontentloaded').catch(() => {});
              } else break;
            }
          
            const input = await findFirst(page, SELECTORS.input, { timeout: 30000, label: 'input' });
            if (!input) {
              throw new Error(
                'Chat input never appeared. The page may require login (set the AUTH_JSON secret) ' +
                'or is blocking automated browsers. Check logs/screenshots and the PROBE output above.'
              );
            }
            vlog(`Page ready: "${await page.title()}"`);
          }
          
          async function newChat(page) {
            vlog('newChat: looking for new-chat button');
            const btn = await findFirst(page, SELECTORS.newChat, { timeout: 1500, label: 'newChat' });
            if (btn) { vlog('newChat: clicking button'); await action(page, 'click-button', () => btn.click()).catch((e) => vlog('newChat click failed:', e.message)); }
            else { vlog('newChat: no button, navigating to base URL'); await action(page, 'navigate', () => page.goto(CFG.url, { waitUntil: 'domcontentloaded', timeout: 60000 })); }
            await findFirst(page, SELECTORS.input, { timeout: 30000, label: 'input' });
            vlog(`newChat: done, url=${page.url()}`);
          }
          
          async function sendMessage(page, text, tag) {
            const input = await findFirst(page, SELECTORS.input, { timeout: 15000, label: 'input' });
            if (!input) throw new Error('Chat input not found (no input selector matched, see PROBE output)');
          
            const before = await input.evaluate((el) => ({
              tag: el.tagName, editable: el.isContentEditable, disabled: !!el.disabled,
              readOnly: !!el.readOnly, contentLen: ((el.value !== undefined ? el.value : el.textContent) || '').length,
            })).catch((e) => ({ error: String(e) }));
            vlog(`${tag} input element before fill:`, before);
          
            await action(page, `${tag}-scroll-input`, () => input.scrollIntoViewIfNeeded()).catch(() => {});
            await action(page, `${tag}-focus-input`, () => input.click());
            await action(page, `${tag}-clear-input`, () => input.fill(''));
            await action(page, `${tag}-fill-input`, () => input.fill(text));
            await sleep(200);
          
            const typed = await input.evaluate((el) => (el.value !== undefined ? el.value : el.textContent) || '').catch(() => '');
            vlog(`${tag} typed into input: ${typed.length}/${text.length} chars, exact match=${typed.trim() === text.trim()}`);
            if (typed.trim() !== text.trim()) block(`${tag} WARNING input content differs from prompt`, typed);
          
            let method = null;
            for (const sel of SELECTORS.sendButton) {
              const count = await page.locator(sel).count().catch(() => 0);
              const btn = page.locator(sel).first();
              const vis = await btn.isVisible().catch(() => false);
              const en = await btn.isEnabled().catch(() => false);
              dlog(`${tag} send-button candidate "${sel}": count=${count} visible=${vis} enabled=${en}`);
              if (vis && en) {
                await action(page, 'click-button', () => btn.click());
                method = `clicked "${sel}"`;
                break;
              }
            }
            if (!method) {
              vlog(`${tag} no usable send button, pressing Enter`);
              await action(page, `${tag}-press-enter`, () => input.press('Enter'));
              method = 'pressed Enter';
            }
            vlog(`${tag} submit method: ${method}`);
          
            await sleep(1000);
            const leftover = await input.evaluate((el) => (el.value !== undefined ? el.value : el.textContent) || '').catch(() => '');
            if (leftover.trim()) {
              vlog(`${tag} input not cleared after submit (${leftover.trim().length} chars left), pressing Enter again`);
              await action(page, `${tag}-press-enter`, () => input.press('Enter')).catch((e) => vlog(`${tag} second Enter failed: ${e.message}`));
            } else {
              dlog(`${tag} input cleared after submit (message accepted)`);
            }
          
            const body = await bodyText(page).catch(() => '');
            vlog(`${tag} prompt visible in page body after submit: ${body.includes(text.slice(0, 40))}`);
          }
          
          /**
           * Waits until new content appears and stays unchanged for CFG.stableMs
           * while no "stop generating" button is visible.
           */
          async function waitForReply(page, { baselineBubble, baselineBody, prompt, timeoutMs, tag }) {
            const start = Date.now();
            const deadline = start + timeoutMs;
            let lastStreamCapture = 0;
            let lastSnap = '', lastChange = Date.now(), lastBeat = 0, sawNew = false, polls = 0, mode = '?', stopVisible = false;
          
            while (Date.now() < deadline) {
              await sleep(CFG.pollMs);
              polls++;
              stopVisible = await anyVisible(page, SELECTORS.stopButton);
              const a = await latestAssistant(page);
              let snap;
              if (a.text !== null) {
                mode = `bubble ${a.sel} (x${a.count})`;
                snap = a.text;
                if (snap && snap !== baselineBubble) sawNew = true;
              } else {
                mode = 'body-diff (NO assistant selector matched)';
                snap = stripPrompt(diffTail(baselineBody, await bodyText(page)), prompt);
                if (snap.trim()) sawNew = true;
              }
          
              if (snap && snap !== lastSnap) {
                lastSnap = snap;
                lastChange = Date.now();
                block(`${tag} OUTPUT snapshot (may be partial)`, snap);
                if (Date.now() - lastStreamCapture >= 5000) {
                  await screenshot(page, `${tag}-streaming`);
                  lastStreamCapture = Date.now();
                }
                dlog(`${tag} content changed: mode=${mode} len=${snap.length} stopBtn=${stopVisible} tail="${snap.slice(-80).replace(/\n/g, '\\n')}"`);
              }
          
              const quietFor = Date.now() - lastChange;
              if (Date.now() - lastBeat >= 5000) {
                lastBeat = Date.now();
                dlog(`${tag} waiting ${((Date.now() - start) / 1000).toFixed(0)}s | mode=${mode} | sawNew=${sawNew} | snapLen=${lastSnap.length} | stopBtn=${stopVisible} | quietFor=${quietFor}ms (need ${CFG.stableMs})`);
              }
          
              if (sawNew && lastSnap.trim() && quietFor >= CFG.stableMs && !stopVisible) {
                vlog(`${tag} reply complete after ${((Date.now() - start) / 1000).toFixed(1)}s (${polls} polls, mode=${mode})`);
                await screenshot(page, `${tag}-reply-complete`);
                return lastSnap.trim();
              }
            }
            block(`${tag} LAST OUTPUT BEFORE TIMEOUT`, lastSnap);
            await screenshot(page, `${tag}-reply-timeout`);
            throw new Error(
              `Timed out after ${timeoutMs}ms waiting for a reply. mode=${mode} sawNew=${sawNew} stopBtnVisible=${stopVisible} ` +
              `lastSnapLen=${lastSnap.length} lastCaptured="${lastSnap.slice(0, 200)}"`
            );
          }
          
          async function recover(page) {
            vlog(`recover: reloading page (url=${page.url()})`);
            try {
              await action(page, 'recover-reload', () => page.reload({ waitUntil: 'domcontentloaded', timeout: 45000 }));
              const ok = await findFirst(page, SELECTORS.input, { timeout: 30000, label: 'input' });
              vlog(`recover: reload done, input ${ok ? 'found' : 'NOT found'}, url=${page.url()}`);
            } catch (e) {
              vlog(`recover: FAILED: ${e.message}`);
            }
          }
          
          /* ================================= main ================================ */
          
          (async () => {
            const startedAt = new Date().toISOString();
            const startTurn = 1; // Every workflow run starts at turn 1.
            const expected = CFG.totalTurns - startTurn + 1;
            const allEntries = [];
          
            emit('='.repeat(78));
            vlog('CHAT STRESS TEST');
            vlog(`node ${process.version} | target ${CFG.url}`);
            vlog(`turns ${startTurn}..${CFG.totalTurns} (${expected} to run) | delay ${CFG.turnDelayMs}ms | reply timeout ${CFG.replyTimeoutMs}ms | stable ${CFG.stableMs}ms`);
            vlog(`newChatEvery=${CFG.newChatEvery} headless=${CFG.headless} verbose=${CFG.verbose} AUTH_JSON=${process.env.AUTH_JSON ? 'provided' : 'not set'}`);
            emit('='.repeat(78));
          
            fs.appendFileSync(TRANSCRIPT, `\n# Run ${startedAt} | turns ${startTurn}-${CFG.totalTurns}\n\n`);
            if (process.env.AUTH_JSON) fs.writeFileSync('auth.json', process.env.AUTH_JSON);
          
            const browser = await chromium.launch({
              headless: CFG.headless,
              args: ['--disable-blink-features=AutomationControlled', '--disable-dev-shm-usage', '--no-sandbox'],
            });
            const ua = `Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/${browser.version()} Safari/537.36`;
            vlog(`chromium ${browser.version()} | UA: ${ua}`);
          
            const context = await browser.newContext({
              viewport: { width: 1366, height: 850 },
              locale: 'en-US',
              storageState: process.env.AUTH_JSON ? 'auth.json' : undefined,
              userAgent: ua,
            });
            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
            });
          
            const page = await context.newPage();
            page.setDefaultTimeout(15000);
          
            // Surface everything the browser itself is complaining about
            page.on('console', (m) => {
              if (CFG.verbose && (m.type() === 'error' || m.type() === 'warning')) vlog(`  [browser ${m.type()}]`, m.text().slice(0, 250));
            });
            page.on('pageerror', (e) => vlog('  [browser pageerror]', String(e.message).slice(0, 250)));
            page.on('requestfailed', (r) => vlog(`  [request failed] ${r.method()} ${r.url().slice(0, 140)} :: ${(r.failure() || {}).errorText}`));
            page.on('response', (r) => { if (r.status() >= 400) vlog(`  [HTTP ${r.status()}] ${r.request().method()} ${r.url().slice(0, 140)}`); });
            page.on('framenavigated', (f) => { if (f === page.mainFrame()) vlog(`  [navigated] ${f.url()}`); });
          
            let ok = 0, failed = 0, ackCount = 0, consecutiveFailures = 0;
            const durations = [];
          
            try {
              await waitUntilReady(page);
              await probe(page, 'startup');
              await screenshot(page, 'startup');
            } catch (e) {
              vlog(`STARTUP FAILED: ${e.message}`);
              await captureDebug(page, 'startup-failure');
              writeSummary({ status: 'aborted-at-startup', error: String(e.message), ok, failed });
              await browser.close();
              process.exit(1);
            }
          
            for (let turn = startTurn; turn <= CFG.totalTurns; turn++) {
              if (CFG.newChatEvery > 0 && turn > startTurn && (turn - 1) % CFG.newChatEvery === 0) {
                vlog(`starting a new chat (every ${CFG.newChatEvery} turns)`);
                await newChat(page);
              }
          
              const prompt =
                `Stress-test message ${turn} of ${CFG.totalTurns}. ` +
                `Reply with exactly "ACK ${turn}" followed by one short sentence.`;
          
              const entry = { turn, timestamp: new Date().toISOString(), prompt, attemptLog: [] };
              let attempt = 0, success = false, lastError = '';
          
              emit('');
              emit('='.repeat(78));
              vlog(`TURN ${turn}/${CFG.totalTurns} | ok=${ok} failed=${failed} | url=${page.url()}`);
              emit('='.repeat(78));
          
              while (attempt < 2 && !success) {
                attempt++;
                const tag = `[t${turn}.a${attempt}]`;
                let stage = 'baseline';
                const t0 = Date.now();
                try {
                  vlog(`${tag} attempt ${attempt}/2 starting`);
                  block(`${tag} INPUT sent to chat`, prompt);
          
                  const base = await latestAssistant(page);
                  const baselineBubble = base.text ?? '';
                  const baselineBody = await bodyText(page);
                  vlog(`${tag} baseline: assistant bubbles=${base.count} (via ${base.sel}), last bubble len=${baselineBubble.length}, body len=${baselineBody.length}`);
                  if (baselineBubble) block(`${tag} baseline (previous) assistant bubble`, baselineBubble.slice(0, 300));
          
                  stage = 'send';
                  await sendMessage(page, prompt, tag);
          
                  stage = 'wait-for-reply';
                  entry.response = await waitForReply(page, {
                    baselineBubble, baselineBody, prompt, timeoutMs: CFG.replyTimeoutMs, tag,
                  });
                  entry.durationMs = Date.now() - t0;
                  entry.ackValid = new RegExp(`ACK\\s*${turn}\\b`).test(entry.response);
                  success = true; // Capture success; ACK correctness is reported separately.
          
                  block(`${tag} OUTPUT received from chat`, entry.response);
                  vlog(`${tag} RESULT: reply captured in ${(entry.durationMs / 1000).toFixed(1)}s | expected "ACK ${turn}" found: ${entry.ackValid}`);
          
                  if (!entry.ackValid) {
                    vlog(`${tag} WARNING: reply does NOT contain "ACK ${turn}". Either the site replied differently, or the captured text is not the reply (wrong element / partial / previous message).`);
                    await captureDebug(page, `turn-${turn}-a${attempt}-noack`);
                  } else if (turn <= 2) {
                    await captureDebug(page, `turn-${turn}-a${attempt}-sample`);
                  }
                } catch (err) {
                  const msg = String((err && err.message) || err);
                  const ms = Date.now() - t0;
                  lastError = msg.slice(0, 800);
                  entry.durationMs = ms;
                  entry.attemptLog.push({ attempt, stage, error: msg.slice(0, 500), durationMs: ms });
          
                  emit(`  !!!! ${tag} FAILED at stage "${stage}" after ${ms}ms`);
                  emit(`  !!!! error: ${msg}`);
                  if (err && err.stack) block(`${tag} stack trace`, err.stack);
                  await captureDebug(page, `turn-${turn}-a${attempt}-FAIL-${stage}`);
          
                  if (attempt < 2) {
                    vlog(`${tag} will recover and retry (same prompt will be sent again)`);
                    await recover(page);
                  }
                }
              }
          
              entry.attempt = attempt;
              entry.ok = success;
              if (!success) entry.error = lastError;
              allEntries.push(entry);
          
              if (entry.ok) {
                ok++; consecutiveFailures = 0;
                durations.push(entry.durationMs);
                if (entry.ackValid) ackCount++;
              } else {
                failed++; consecutiveFailures++;
              }
          
              appendJsonl(entry);
              appendTranscript(entry);
              writeSummary({ status: 'running', startedAt, lastTurn: turn, expected, ok, failed, ackCount, screenshots: captureSequence });
          
              vlog(
                `[turn ${turn}/${CFG.totalTurns}] ${entry.ok ? 'OK' : 'FAILED'} | ` +
                `${((entry.durationMs || 0) / 1000).toFixed(1)}s | attempts=${attempt} | ` +
                `ACK=${entry.ackValid ? 'yes' : 'NO'} | totals: ok=${ok} failed=${failed} ackValid=${ackCount}`
              );
          
              if (consecutiveFailures >= CFG.abortAfterConsecutiveFailures) {
                vlog(`ABORTING: ${consecutiveFailures} consecutive failed turns (rate limit or block?)`);
                break;
              }
          
              const pause = CFG.turnDelayMs + Math.random() * 1500;
              dlog(`sleeping ${Math.round(pause)}ms before next turn`);
              await sleep(pause);
            }
          
            /* ------------------------------ final report ------------------------------ */
          
            const avg = durations.length ? Math.round(durations.reduce((a, b) => a + b, 0) / durations.length) : 0;
          
            emit('');
            emit('='.repeat(78));
            vlog('FINAL REPORT');
            emit('='.repeat(78));
            const flaky = allEntries.filter((e) => e.attemptLog.length);
            vlog(`turns ok: ${ok}/${expected} | turns failed: ${failed} | ACK-valid replies: ${ackCount} | turns needing retry: ${flaky.length} | avg ${(avg / 1000).toFixed(1)}s`);
            if (flaky.length) {
              emit('  Failed attempts (turn / attempt / stage / duration / error):');
              for (const e of flaky) {
                for (const a of e.attemptLog) emit(`    turn ${e.turn} a${a.attempt} [${a.stage}] ${a.durationMs}ms :: ${a.error}`);
              }
            }
            const noAck = allEntries.filter((e) => e.ok && !e.ackValid).map((e) => e.turn);
            if (noAck.length) emit(`  Turns whose reply did NOT contain the expected ACK: ${noAck.join(', ')}`);
          
            writeSummary({
              status: ok === expected && ackCount === expected ? 'complete' : ok > 0 ? 'partial' : 'failed',
              startedAt,
              finishedAt: new Date().toISOString(),
              expected, ok, failed, ackCount,
              turnsWithRetry: flaky.map((e) => e.turn),
              turnsWithoutAck: noAck,
              avgDurationMs: avg,
            });
          
            await browser.close();
            process.exitCode = ok === expected && ackCount === expected ? 0 : 1;
          })().catch((err) => {
            vlog('FATAL ERROR:', String(err.stack || err));
            writeSummary({ status: 'fatal', error: String(err.stack || err) });
            process.exit(1);
          });
          EOF

      - name: Run stress test
        timeout-minutes: 330
        env:
          TOTAL_TURNS: ${{ inputs.total_turns }}
          TURN_DELAY_MS: ${{ inputs.turn_delay_ms }}
          NEW_CHAT_EVERY: ${{ inputs.new_chat_every }}
          TARGET_URL: ${{ inputs.target_url }}
          HEADLESS: "true"
          VERBOSE: "true"
          AUTH_JSON: ${{ secrets.AUTH_JSON }}   # optional
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          node chat-stress.js 2>&1 | tee logs/runner-console.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Chat stress test"
            echo '```json'
            cat logs/summary.json 2>/dev/null || echo '{"status":"no summary written"}'
            echo '```'
            echo "### Errors and warnings (last 60)"
            echo '```'
            grep -E "FAILED|!!!!|WARNING|NO MATCH|HTTP [45]|request failed|pageerror" logs/debug.log 2>/dev/null | tail -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package all diagnostics into ZIP
        if: always()
        shell: bash
        run: |
          mkdir -p logs
          cp chat-stress.js logs/ 2>/dev/null || true
          python3 - <<'PYZIP'
          import os, zipfile
          from pathlib import Path
          root = Path('logs')
          if not (root / 'summary.json').exists():
              (root / 'packaging-note.txt').write_text('No final summary: inspect runner-console.log and debug.log for startup errors or interruption.\n')
          with zipfile.ZipFile('chat-diagnostics.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      z.write(file, file.as_posix())
          print('ZIP size:', os.path.getsize('chat-diagnostics.zip'), 'bytes')
          PYZIP

      - name: Upload diagnostics ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: chat-diagnostics.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
