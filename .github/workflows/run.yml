# =============================================================================
# chat.z.ai stress test — single-file version (v2)
#
# v2 changes (after startup failures on the runner):
#   - Headed Chromium under xvfb by default (headless gets bot-blocked)
#   - Waits up to 120s for Cloudflare challenges to clear (title AND body checks)
#   - Dismisses cookie banners
#   - On startup failure: dumps title/URL/body text/screenshot/page HTML to
#     logs/debug/ -> artifact + job summary, so failures are self-explanatory
#   - Pinned Playwright version + browser cache for faster, stable runs
#
# Everything lives here: the workflow AND the Playwright script (heredoc).
# Logs land in the run artifact:
#   logs/chat-log.jsonl   one JSON object per turn (every input + output)
#   logs/transcript.md    human-readable transcript
#   logs/summary.json     run stats
#   logs/debug/           startup diagnostics if the page never became usable
#   logs/screenshots/     captures on turn failures
#
# ~300 turns at 15-40s/reply takes roughly 2-4 hours (under the 6h job cap).
# =============================================================================

name: chat.z.ai stress test

on:
  workflow_dispatch:
    inputs:
      turns:
        description: 'Number of back-and-forth exchanges'
        required: false
        default: '300'
      turn_delay_ms:
        description: 'Delay between messages (ms)'
        required: false
        default: '2500'
      new_chat_every:
        description: 'Start a new chat every N turns (0 = one long conversation)'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-zai-stress.yml'

env:
  PLAYWRIGHT_VERSION: '1.49.1'

concurrency:
  group: chat-zai-stress
  cancel-in-progress: false

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # keep below the 6-hour GitHub job cap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Resume support: if a previous run failed/was interrupted, continue
      # from the last completed turn instead of starting over.
      - name: Restore chat progress from previous failed run
        uses: actions/cache/restore@v4
        with:
          path: logs
          key: zai-stress-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zai-stress-

      # Chromium download is ~160MB — cache it keyed on the pinned version.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install xvfb (virtual display)
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          else
            echo "xvfb already present"
          fi

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@"${PLAYWRIGHT_VERSION}" --no-fund --no-audit
          npx playwright install --with-deps chromium

      # ---------------------------------------------------------------
      # The test script, embedded so the whole setup stays in one file.
      # ---------------------------------------------------------------
      - name: Write test script
        run: |
          cat > stress.cjs <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const int = (v, d) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : d; };

          const CFG = {
            url: process.env.TARGET_URL || 'https://chat.z.ai/',
            totalTurns: int(process.env.TOTAL_TURNS, 300),
            turnDelayMs: int(process.env.TURN_DELAY_MS, 2500),
            replyTimeoutMs: int(process.env.REPLY_TIMEOUT_MS, 180000),
            newChatEvery: int(process.env.NEW_CHAT_EVERY, 0),
            headless: (process.env.HEADLESS || 'true') !== 'false',
            stableMs: int(process.env.STABLE_MS, 4000),
          };
          const pollMs = 500;

          const LOG_DIR = 'logs';
          const JSONL_FILE = path.join(LOG_DIR, 'chat-log.jsonl');
          const TRANSCRIPT = path.join(LOG_DIR, 'transcript.md');
          const SUMMARY = path.join(LOG_DIR, 'summary.json');
          const DEBUG_DIR = path.join(LOG_DIR, 'debug');
          const SHOTS = path.join(LOG_DIR, 'screenshots');
          fs.mkdirSync(SHOTS, { recursive: true });
          fs.mkdirSync(DEBUG_DIR, { recursive: true });

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const now = () => new Date().toISOString();
          const log = (m) => console.log(`[${now()}] ${m}`);
          const appendJsonl = (e) => fs.appendFileSync(JSONL_FILE, JSON.stringify(e) + '\n');

          function appendTranscript(e) {
            const status = e.ok
              ? `ok (${(e.durationMs / 1000).toFixed(1)}s${e.ackValid ? ', ACK valid' : ''})`
              : `FAILED (${e.error || 'unknown error'})`;
            const md = [
              `## Turn ${e.turn} | ${e.timestamp} | ${status}`, '',
              '**Input:**', '', '```', e.prompt, '```', '',
            ];
            if (e.ok) md.push('**Output:**', '', '```', e.response, '```', '');
            fs.appendFileSync(TRANSCRIPT, md.join('\n') + '\n');
          }

          function loadProgress() {
            if (!fs.existsSync(JSONL_FILE)) return 0;
            let last = 0;
            for (const line of fs.readFileSync(JSONL_FILE, 'utf8').split('\n')) {
              if (!line.trim()) continue;
              try { const e = JSON.parse(line); if (e.ok && e.turn > last) last = e.turn; } catch {}
            }
            return last;
          }

          function writeSummary(status, extra = {}) {
            fs.writeFileSync(SUMMARY, JSON.stringify({ status, timestamp: now(), ...extra, config: CFG }, null, 2));
          }

          async function shot(page, name) {
            try { await page.screenshot({ path: path.join(SHOTS, `${name}.png`), fullPage: true }); } catch {}
          }

          // -----------------------------------------------------------------
          // Verify/tune these with:  npx playwright codegen https://chat.z.ai
          // First matching selector wins. If NO assistantMessage selector
          // matches, the script falls back to a whole-page text diff and
          // still logs replies correctly.
          // -----------------------------------------------------------------
          const SELECTORS = {
            input: [
              'textarea[placeholder]',
              'div[contenteditable="true"]',
              'textarea',
              '[role="textbox"]',
            ],
            sendButton: [
              'button[aria-label*="send" i]',
              'button[data-testid*="send" i]',
            ],
            stopButton: [
              'button[aria-label*="stop" i]',
              'button[data-testid*="stop" i]',
            ],
            assistantMessage: [
              '[data-message-author-role="assistant"]',
              '[class*="assistant" i][class*="message" i]',
              '[class*="assistant" i][class*="bubble" i]',
            ],
            newChat: [
              'a[aria-label*="new chat" i]',
              'button[aria-label*="new chat" i]',
              'a[href$="/new"]',
            ],
          };

          async function findFirst(page, sels, timeout = 3000) {
            for (const s of sels) {
              const loc = page.locator(s).first();
              try { await loc.waitFor({ state: 'visible', timeout }); return loc; } catch {}
            }
            return null;
          }

          async function anyVisible(page, sels) {
            for (const s of sels) {
              if (await page.locator(s).first().isVisible().catch(() => false)) return true;
            }
            return false;
          }

          async function latestBubble(page) {
            for (const s of SELECTORS.assistantMessage) {
              const t = await page.locator(s).last().innerText({ timeout: 400 }).catch(() => '');
              if (t && t.trim()) return t.trim();
            }
            return null;
          }

          const bodyText = (page) => page.evaluate(() => document.body.innerText);

          // Dump everything needed to understand WHY the page is not usable.
          async function dumpDebug(page, reason) {
            const info = {
              reason: String(reason).slice(0, 300),
              url: page.url(),
              title: await page.title().catch(() => ''),
              bodySnippet: (await bodyText(page).catch(() => '')).slice(0, 1500),
              timestamp: now(),
            };
            fs.writeFileSync(path.join(DEBUG_DIR, 'startup.json'), JSON.stringify(info, null, 2));
            await page.screenshot({ path: path.join(DEBUG_DIR, 'startup.png'), fullPage: true }).catch(() => {});
            fs.writeFileSync(path.join(DEBUG_DIR, 'page.html'), await page.content().catch(() => ''));
            console.error('--- STARTUP DEBUG ---\n' + JSON.stringify(info, null, 2) + '\n---------------------');
            return info;
          }

          const CHALLENGE_RE = /just a moment|attention required|verify you are human|checking your browser|cf-chl|challenge-platform|turnstile/i;

          async function waitReady(page) {
            await page.goto(CFG.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            let input = null;
            const deadline = Date.now() + 120000;
            let lastStatus = '';
            while (Date.now() < deadline) {
              input = await findFirst(page, SELECTORS.input, 2000);
              if (input) break;
              const title = await page.title().catch(() => '');
              const body = await bodyText(page).catch(() => '');
              const challenge = CHALLENGE_RE.test(title) || CHALLENGE_RE.test(body.slice(0, 3000));
              const status = challenge
                ? `bot-protection challenge on screen ("${title.slice(0, 60)}") — waiting for it to clear`
                : `no chat input yet ("${title.slice(0, 60) || 'no title'}") — waiting`;
              if (status !== lastStatus) { lastStatus = status; log(status); }
              await sleep(5000);
            }
            if (!input) throw new Error('chat input never appeared within 120s (login wall or bot block)');
            for (const t of ['Accept all', 'Accept', 'I agree', 'Got it']) {
              const b = page.locator(`button:has-text("${t}")`).first();
              if (await b.isVisible().catch(() => false)) { await b.click().catch(() => {}); log(`dismissed "${t}" banner`); break; }
            }
            log(`page ready: "${await page.title()}"`);
          }

          async function newChat(page) {
            const btn = await findFirst(page, SELECTORS.newChat, 1500);
            if (btn) await btn.click().catch(() => {});
            else await page.goto(CFG.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await findFirst(page, SELECTORS.input, 30000);
          }

          async function send(page, text) {
            const input = await findFirst(page, SELECTORS.input, 15000);
            if (!input) throw new Error('chat input not found');
            await input.scrollIntoViewIfNeeded().catch(() => {});
            await input.click();
            await input.fill('');
            await input.fill(text);
            await sleep(200);
            let clicked = false;
            for (const s of SELECTORS.sendButton) {
              const b = page.locator(s).first();
              if ((await b.isVisible().catch(() => false)) && (await b.isEnabled().catch(() => false))) {
                await b.click();
                clicked = true;
                break;
              }
            }
            if (!clicked) await input.press('Enter');
            // Some UIs swallow the first submit: if the box did not clear, press Enter again.
            await sleep(1000);
            const leftover = await input
              .evaluate((el) => (el.value !== undefined ? el.value : el.textContent) || '')
              .catch(() => '');
            if (leftover.trim()) await input.press('Enter').catch(() => {});
          }

          // Waits until new content appears and stays unchanged for stableMs
          // with no "stop generating" button visible. Two modes:
          //   bubble mode: tracks the last assistant message element
          //   diff mode (fallback): tracks text appended to the page body
          async function waitReply(page, { bubbleBase, bodyBase, prompt, timeoutMs }) {
            const deadline = Date.now() + timeoutMs;
            let snap = '';
            let lastChange = Date.now();
            let sawNew = false;
            while (Date.now() < deadline) {
              await sleep(pollMs);
              const stopping = await anyVisible(page, SELECTORS.stopButton);
              const bubble = await latestBubble(page);
              let cur = '';
              if (bubble !== null) {
                cur = bubble;
                if (cur && cur !== bubbleBase) sawNew = true;
              } else {
                let after = await bodyText(page);
                if (bodyBase && after.startsWith(bodyBase)) after = after.slice(bodyBase.length);
                cur = after.split(prompt).pop().trim();
                if (cur) sawNew = true;
              }
              if (cur && cur !== snap) { snap = cur; lastChange = Date.now(); }
              if (sawNew && snap && Date.now() - lastChange >= CFG.stableMs && !stopping) return snap;
            }
            throw new Error(`no stable reply within ${timeoutMs}ms (last captured: "${snap.slice(0, 120)}")`);
          }

          async function recover(page) {
            try {
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 45000 });
              await findFirst(page, SELECTORS.input, 30000);
            } catch (e) {
              log(`recovery failed: ${e.message}`);
            }
          }

          (async () => {
            // Always leave something in logs/ so failures are diagnosable.
            writeSummary('starting', { turnsDone: 0, ok: 0, failed: 0 });
            try { log(`playwright ${require('playwright/package.json').version}`); } catch {}

            const startTurn = loadProgress() + 1;
            const expected = CFG.totalTurns - startTurn + 1;
            log(`stress test target: ${CFG.totalTurns} turns (starting at ${startTurn}, headless=${CFG.headless})`);
            if (expected <= 0) {
              log('previous run already completed all turns; nothing to do');
              writeSummary('complete', { ok: 0, failed: 0, note: 'nothing to do (already completed)' });
              return;
            }

            fs.appendFileSync(TRANSCRIPT, `\n---\n# Run ${now()} | turns ${startTurn}-${CFG.totalTurns}\n`);
            if (process.env.AUTH_JSON) fs.writeFileSync('auth.json', process.env.AUTH_JSON, { mode: 0o600 });

            const browser = await chromium.launch({
              headless: CFG.headless,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--disable-blink-features=AutomationControlled'],
            });
            const context = await browser.newContext({
              viewport: { width: 1366, height: 850 },
              locale: 'en-US',
              storageState: process.env.AUTH_JSON ? 'auth.json' : undefined,
              userAgent: (await browser.userAgent()).replace('HeadlessChrome', 'Chrome'),
            });
            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', { get: () => undefined });
              try { window.chrome = window.chrome || { runtime: {} }; } catch {}
              try { Object.defineProperty(navigator, 'languages', { get: () => ['en-US', 'en'] }); } catch {}
              try { Object.defineProperty(navigator, 'plugins', { get: () => [1, 2, 3, 4, 5] }); } catch {}
            });
            const page = await context.newPage();
            page.setDefaultTimeout(20000);

            let ok = 0, failed = 0, ackOk = 0, consecutiveFails = 0;
            const durations = [];

            try {
              await waitReady(page);
            } catch (e) {
              await shot(page, 'startup-failure');
              const dbg = await dumpDebug(page, e.message || e);
              writeSummary('aborted-at-startup', { error: String(e.message || e).slice(0, 500), debug: dbg });
              log(`FATAL: ${e.message}`);
              await browser.close();
              process.exit(1);
            }

            for (let turn = startTurn; turn <= CFG.totalTurns; turn++) {
              if (CFG.newChatEvery > 0 && turn > startTurn && (turn - 1) % CFG.newChatEvery === 0) {
                log(`turn ${turn}: starting a new chat (every ${CFG.newChatEvery})`);
                await newChat(page);
              }

              const prompt = `Stress-test message ${turn} of ${CFG.totalTurns}. Reply with exactly "ACK ${turn}" followed by one short sentence mentioning the number ${turn}.`;
              const entry = { turn, timestamp: now(), prompt };
              let success = false;

              for (let attempt = 1; attempt <= 2 && !success; attempt++) {
                const bubbleBase = (await latestBubble(page)) || '';
                const bodyBase = await bodyText(page);
                const t0 = Date.now();
                try {
                  await send(page, prompt);
                  entry.response = await waitReply(page, { bubbleBase, bodyBase, prompt, timeoutMs: CFG.replyTimeoutMs });
                  entry.ackValid = new RegExp(`ACK\\s*${turn}\\b`).test(entry.response);
                  entry.durationMs = Date.now() - t0;
                  delete entry.error;
                  success = true;
                } catch (e) {
                  entry.error = String(e.message || e).slice(0, 500);
                  entry.durationMs = Date.now() - t0;
                  if (attempt < 2) {
                    log(`turn ${turn} attempt 1 failed: ${entry.error} -- recovering and retrying`);
                    await recover(page);
                  }
                }
              }

              entry.ok = success;
              if (success) {
                ok++; consecutiveFails = 0; durations.push(entry.durationMs);
                if (entry.ackValid) ackOk++;
              } else {
                failed++; consecutiveFails++;
                await shot(page, `turn-${turn}-failure`);
              }

              appendJsonl(entry);
              appendTranscript(entry);

              const avg = durations.length ? Math.round(durations.reduce((a, b) => a + b, 0) / durations.length) : 0;
              writeSummary(turn === CFG.totalTurns && failed === 0 ? 'complete' : 'running', {
                turnsDone: turn, ok, failed, ackOk, consecutiveFails, avgDurationMs: avg,
              });
              log(`turn ${turn}/${CFG.totalTurns}: ${success ? 'ok' : 'FAILED'} in ${((entry.durationMs || 0) / 1000).toFixed(1)}s | ok=${ok} failed=${failed}`);

              if (consecutiveFails >= 5) {
                log('aborting: 5 consecutive failures (site likely rate-limiting or blocking)');
                break;
              }

              await sleep(CFG.turnDelayMs + Math.random() * 1500);
            }

            const avg = durations.length ? Math.round(durations.reduce((a, b) => a + b, 0) / durations.length) : 0;
            const finalStatus = failed === 0 && ok === expected ? 'complete' : (ok > 0 ? 'partial' : 'failed');
            writeSummary(finalStatus, { turnsDone: ok + failed, ok, failed, ackOk, avgDurationMs: avg });
            log(`done: ${ok}/${expected} exchanges succeeded (ACK-valid: ${ackOk}), avg ${(avg / 1000).toFixed(1)}s/turn`);

            await browser.close();
            process.exit(failed > 0 ? 1 : 0);
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF

      # Headed Chromium inside a virtual display — much less likely to be
      # bot-blocked than headless. (Set HEADLESS: 'true' and run plain
      # `node stress.cjs` if you want to try headless again.)
      - name: Run stress test
        env:
          TOTAL_TURNS: ${{ github.event.inputs.turns || '300' }}
          TURN_DELAY_MS: ${{ github.event.inputs.turn_delay_ms || '2500' }}
          NEW_CHAT_EVERY: ${{ github.event.inputs.new_chat_every || '0' }}
          HEADLESS: 'false'
          # Optional logged-in session — see NOTES at the bottom of this file.
          AUTH_JSON: ${{ secrets.ZAI_AUTH_JSON }}
        run: xvfb-run --auto-servernum node stress.cjs

      # Quick view of results directly on the job page, including startup
      # diagnostics when the page never became usable.
      - name: Job summary
        if: always()
        run: |
          {
            echo '### chat.z.ai stress test summary'
            echo '```json'
            cat logs/summary.json 2>/dev/null || echo '(summary.json missing — script crashed before writing it; check the "Run stress test" step log)'
            echo '```'
            if [ -f logs/debug/startup.json ]; then
              echo ''
              echo '#### Startup debug — why the page was not usable'
              echo '```json'
              cat logs/debug/startup.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload chat logs, debug info and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-zai-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          retention-days: 30
          if-no-files-found: warn

      # Only keep progress when the run failed — so a re-run resumes the
      # interrupted test, while completed runs start fresh next time.
      - name: Save progress for resume
        if: failure() || cancelled()
        uses: actions/cache/save@v4
        with:
          path: logs
          key: zai-stress-${{ github.run_id }}-${{ github.run_attempt }}

# =============================================================================
# NOTES
#
# If it still fails at startup:
#   1. Open the run's artifact -> logs/debug/startup.json + startup.png +
#      page.html. That shows exactly what the site rendered (Cloudflare
#      challenge, login wall, layout change...).
#   2. If it's a LOGIN WALL:
#      a. Locally:  npx playwright open --save-storage=auth.json https://chat.z.ai
#         log in, then close the window.
#      b. Put the contents of auth.json into a repo secret ZAI_AUTH_JSON
#         (already wired to AUTH_JSON in the run step).
#   3. The pasted log you sent omitted the "Run stress test" step — that step
#      contains the actual error text; check it first if things fail again.
#
# Tuning:
#   - Replies cut off mid-stream -> raise STABLE_MS (add env, e.g. '8000')
#   - Rate-limited -> raise TURN_DELAY_MS via the workflow input
#
# Courtesy: 300 automated messages against a public service may hit rate
#   limits or violate its terms of use. The script paces itself and backs
#   off rather than hammering — point TARGET_URL at your own deployment if
#   you only need load testing.
# =============================================================================
