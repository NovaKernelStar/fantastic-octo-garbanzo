name: docker-image-unit-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; never kill in-flight pushes to main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege — the workflow never needs more than reading the repo
permissions:
  contents: read

jobs:
  test-image:
    name: "Test: ${{ matrix.image.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1        # one container at a time, strictly sequential
      fail-fast: false       # still test remaining images after one fails
      matrix:
        image:
          - name: service-a
            context: .
            dockerfile: ./Dockerfile
            test_command: npm test -- --run
          - name: service-b
            context: ./api
            dockerfile: ./api/Dockerfile
            test_command: pytest -q

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          tags: ${{ matrix.image.name }}:${{ github.sha }}
          load: true
          # Plain single-platform manifest — avoids OCI-index quirks when
          # docker run consumes a loaded image with default attestations
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Run unit tests inside container
        env:
          # Passed via env so it's evaluated by the CONTAINER's shell, not
          # the host. Commands may safely contain quotes, &&, pipes, etc.
          TEST_CMD: ${{ matrix.image.test_command }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # For images whose ENTRYPOINT ignores "$@", add: --entrypoint /bin/sh
          docker run --rm \
            --init \
            -v "$PWD/artifacts:/artifacts" \
            -e TEST_CMD \
            "${{ matrix.image.name }}:${{ github.sha }}" \
            sh -lc 'eval "$TEST_CMD"' 2>&1 | tee test-output.log

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.image.name }}-${{ github.run_attempt }}
          path: |
            test-output.log
            artifacts/
          if-no-files-found: ignore

  summary:
    needs: test-image
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Final verdict
        run: |
          result="${{ needs.test-image.result }}"
          echo "test-image result: $result"
          case "$result" in
            success)
              echo "All images passed their unit tests." ;;
            *)
              echo "::error::One or more images failed their unit tests (result: $result)"
              exit 1 ;;
          esac
